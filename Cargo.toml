[workspace]
members = ["crates/rho", "crates/rho-providers", "crates/rho-sdk", "crates/rho-tools", "crates/rho-tui-pty"]
exclude = ["fixtures/downstream", "fixtures/publish-boundary"]
resolver = "2"

# Thin LTO + one codegen unit shrink the release binary 90.7 MB -> 56.6 MB and
# steady TUI RSS ~48.7 MB -> ~44 MB (measured 2026-08-15, linux x86_64) at the
# cost of link time. Symbols are stripped for size; panic messages still carry
# their location. Do not add `panic = "abort"`: the TUI recovers from renderer
# panics with `catch_unwind` (tui/markdown/math.rs, mermaid.rs).
# Keep this table in sync with crates/rho/Cargo.toml so `cargo install
# rho-coding-agent` (published crate as root) gets the same profile.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1

[profile.test]
debug = 1

# Use unreleased Windows VT input support so bracketed paste produces Event::Paste.
# Remove this override after crossterm-rs/crossterm#1030 is released.
[patch.crates-io]
crossterm = { git = "https://github.com/crossterm-rs/crossterm", rev = "03bb4f26610a5904b8e875fcb610d16bf7d00814" }
