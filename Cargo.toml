[workspace]
members = ["crates/rho", "crates/rho-providers", "crates/rho-sdk", "crates/rho-tools", "crates/rho-tui-pty"]
exclude = ["fixtures/downstream", "fixtures/publish-boundary"]
resolver = "2"

[workspace.dependencies]
# 0.13 defaults to rustls + aws-lc. rustls-no-provider plus an explicit rustls
# ring dependency keep one crypto provider; the rustls feature would compile
# aws-lc alongside ring. query/form are optional in 0.13; charset/http2/
# system-proxy replace the 0.12 defaults we still want.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "form",
    "http2",
    "json",
    "query",
    "rustls-no-provider",
    "stream",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

# Size-tuned: opt-level "s" + fat LTO + one codegen unit. Measured 2026-10-08
# (linux x86_64, 2.19.0): the stripped binary drops 69.7 MB -> 45.6 MB versus
# opt-level 3 + thin LTO, a 6-8% slowdown on a CPU-bound 17.6 MB session HTML
# export, 15% faster startup, and release builds about as fast (433 s vs 453 s).
# opt-level "z" saved 4 MB more but ran 35% slower; keeping hot crates
# (serde_json, syntect, regex, pulldown-cmark) at opt-level 3 bought nothing
# because fat LTO compiles their generics inside rho at "s" anyway.
# The Arch package must stay under Cloudflare Pages' 25 MiB file limit
# (.github/workflows/publish-arch-package.yml). Symbols are stripped for size;
# panic messages still carry their location. Do not add `panic = "abort"`: the
# TUI recovers from renderer panics with `catch_unwind`
# (tui/markdown/math.rs, mermaid.rs).
# Keep this table in sync with crates/rho/Cargo.toml so `cargo install
# rho-coding-agent` (published crate as root) gets the same profile.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1

[profile.test]
debug = 1
