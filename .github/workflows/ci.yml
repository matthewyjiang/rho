name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality and workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check architecture guardrails
        run: python3 scripts/check_architecture.py
      - name: Test architecture guardrails
        run: python3 scripts/check_architecture.py --self-test
      - name: Check release version consistency
        run: python3 scripts/check_release_versions.py
      - name: Check SDK compatibility metadata
        run: python3 scripts/check_sdk_compatibility.py
      - name: Test SDK redaction evidence schema
        run: python3 scripts/audit_sdk_redaction_tests.py
      - name: Test shell installer release parsing
        run: sh scripts/install_tests.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2
      - name: Test validation scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        # Linux leg of the native PTY suite (tui_pty_native); the platform job
        # covers macOS and Windows. Nextest runs every test in its own process
        # and schedules across test binaries; doctests run in their own step.
        env:
          RHO_PTY_ARTIFACTS: ${{ runner.temp }}/rho-pty-native-artifacts
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Upload native PTY failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-pty-ubuntu-latest-artifacts
          path: ${{ runner.temp }}/rho-pty-native-artifacts/
          if-no-files-found: ignore
      - name: Check docs TUI proof plate
        # Reuses the binary the workspace tests refreshed; see --reuse-build in the script.
        run: bash scripts/check_docs_ui_demo.sh --check --reuse-build
      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked
      - name: Check rho-tools document features independently
        run: |
          cargo check -p rho-agent-tools --no-default-features --features document-docx --locked
          cargo check -p rho-agent-tools --no-default-features --features document-pdf --locked

  pty-smoke:
    name: interactive TUI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2
        with:
          shared-key: pty-smoke
      # Matrix fixtures are compiled under debug_assertions, so the harness
      # requires a debug binary.
      - name: Build debug rho
        run: cargo build -p rho-coding-agent --locked
      - name: Run PTY smoke suite
        run: cargo run -p rho-tui-pty --bin rho-pty-scenario --locked -- --smoke --artifacts pty-artifacts
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pty-smoke-artifacts
          path: pty-artifacts/
          if-no-files-found: ignore

  sdk-features:
    name: SDK feature and downstream contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2
        with:
          shared-key: sdk-features
      - name: Test SDK feature modes
        run: python3 scripts/check_sdk_compatibility.py --test-features
      - name: Compile downstream-only fixtures
        run: python3 scripts/check_sdk_compatibility.py --test-downstream

  msrv:
    name: MSRV ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: rho-sdk
            manifest: crates/rho-sdk/Cargo.toml
            command: cargo nextest run -p rho-sdk --all-targets --all-features --locked --no-fail-fast
          - package: rho-coding-agent
            manifest: crates/rho/Cargo.toml
            command: cargo check --workspace --all-targets --locked
    steps:
      - uses: actions/checkout@v7
      - name: Read MSRV from Cargo metadata
        id: msrv
        shell: bash
        run: |
          version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["rust-version"])' '${{ matrix.manifest }}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2
        with:
          shared-key: msrv-${{ matrix.package }}-${{ steps.msrv.outputs.version }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Validate MSRV
        run: ${{ matrix.command }}

  platform:
    name: ${{ matrix.os }} workspace
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the workspace tests in the quality job; a Linux leg here
        # repeated that suite on the same OS.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2
        with:
          shared-key: platform-${{ matrix.os }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Compile and test the workspace
        # tui_pty_native runs startup, multiline Unicode paste, navigation and
        # clean exit through portable-pty's ConPTY backend on Windows.
        env:
          RHO_PTY_ARTIFACTS: ${{ runner.temp }}/rho-pty-native-artifacts
        run: cargo nextest run --workspace --all-targets --locked --build-jobs 8 --no-fail-fast
      - name: Upload native PTY failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-pty-${{ matrix.os }}-artifacts
          path: ${{ runner.temp }}/rho-pty-native-artifacts/
          if-no-files-found: ignore

  package:
    name: release package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2
        with:
          shared-key: package
      - name: Check the release binary compiles
        run: cargo check --release --locked --bin rho
      - name: Test crate publish prep fixture
        run: python3 scripts/crate_publish_prep.py --self-test
      - name: Verify crate publish preparation
        run: ./scripts/check_crate_publish_prep.sh
      - name: Check package file lists
        shell: bash
        run: |
          set -euo pipefail
          cargo package --list -p rho-sdk > /tmp/rho-sdk-package-files
          cargo package --list -p rho-providers > /tmp/rho-providers-package-files
          cargo package --list -p rho-agent-tools > /tmp/rho-agent-tools-package-files
          cargo package --list -p rho-coding-agent > /tmp/rho-application-package-files
          grep -Fxq Cargo.toml /tmp/rho-sdk-package-files
          grep -Fxq README.md /tmp/rho-sdk-package-files
          grep -Fxq src/lib.rs /tmp/rho-sdk-package-files
          grep -Fxq examples/simple_completion.rs /tmp/rho-sdk-package-files
          grep -Fxq Cargo.toml /tmp/rho-providers-package-files
          grep -Fxq src/lib.rs /tmp/rho-providers-package-files
          grep -Fxq Cargo.toml /tmp/rho-agent-tools-package-files
          grep -Fxq src/lib.rs /tmp/rho-agent-tools-package-files
          grep -Fxq Cargo.toml /tmp/rho-application-package-files
          grep -Fxq src/main.rs /tmp/rho-application-package-files
          grep -Fxq tests/automation_cli.rs /tmp/rho-application-package-files
          grep -Fxq build.rs /tmp/rho-application-package-files
          if grep -Eq '^(\.github|docs|fixtures)/' /tmp/rho-application-package-files; then
            echo "application crate contains repository-only files" >&2
            exit 1
          fi
