name: yank crate version

on:
  workflow_dispatch:
    inputs:
      crate:
        description: crates.io package name
        required: true
        type: string
        default: rho-coding-agent
      version:
        description: Version to yank (must already be published)
        required: true
        type: string

permissions:
  contents: read

jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Yank crate version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ inputs.crate }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$CRATE" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid crate name: $CRATE" >&2
            exit 1
          fi
          cargo yank --vers "$VERSION" "$CRATE"
          echo "Yanked $CRATE $VERSION"
