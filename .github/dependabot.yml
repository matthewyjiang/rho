# Dependabot version updates. Commit prefixes keep PR titles Conventional
# Commits compliant (see AGENTS.md); `build`/`ci` do not trigger release-please.
#
# fixtures/downstream and fixtures/publish-boundary are intentionally not
# tracked: they are test fixtures with pinned lockfiles, not shipped code.
version: 2

updates:
  # Rust workspace (Cargo.toml + Cargo.lock at the root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 10
    groups:
      # One PR for all semver-compatible bumps; majors get their own PRs
      # since they usually need code changes.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # VitePress docs site.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docs:
        patterns:
          - "*"

  # Workflow actions under .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
