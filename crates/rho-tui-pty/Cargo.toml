[package]
name = "rho-tui-pty"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Deterministic PTY harness for Rho interactive TUI tests"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-width = "0.2"
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"

[dev-dependencies]
pretty_assertions = "1"

[[bin]]
name = "rho-pty-scenario"
path = "src/bin/rho_pty_scenario.rs"

[[bin]]
name = "rho-pty-demo"
path = "src/bin/rho_pty_demo.rs"
