[package]
name = "rho-protocol"
version = "1.5.0"
edition = "2021"
rust-version = "1.86"
description = "Versioned JSON-RPC protocol between the Rho daemon and its frontends"
license = "MIT"
repository = "https://github.com/matthewyjiang/rho"
readme = "README.md"
keywords = ["agent", "ai", "json-rpc", "protocol"]
categories = ["asynchronous", "network-programming"]

# Frontends (the TUI, rho-ui, `rho acp`, MCP) depend on this crate, so it must
# not depend on rho-sdk: an SDK major must never break a frontend build.
# scripts/architecture.json enforces that boundary.
[dependencies]
# Publishes the wire types as JSON Schema (`schema/protocol.json`).
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 1.36 adds `JoinSet::try_join_next`, which reaps a connection's finished
# request tasks. `time` bounds a closing connection's writes, and paces
# `LocalDaemon`'s wait for a busy pipe on Windows.
tokio = { version = "1.36", features = ["io-util", "macros", "rt", "sync", "time"] }

# `LocalDaemon` and `DaemonEndpoint` find and start the daemon: `net` and
# `process` reach and start it. A browser has neither, and Tokio refuses to
# build them for wasm, so there the crate has neither type: a frontend in a
# browser reaches a daemon over a stream of its own, through
# `Client::handshake_with_io`.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Names a rho home's daemon endpoint (`DaemonEndpoint`).
sha2 = "0.11"
tokio = { version = "1.36", features = ["net", "process"] }

# `LocalDaemon` checks that the daemon's named pipe is the current user's
# before it writes to it, and starts `rho daemon start` with no console window.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1.36", features = ["test-util", "time"] }
