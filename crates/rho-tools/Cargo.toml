[package]
name = "rho-agent-tools"
version = "0.15.1"
edition = "2021"
rust-version = "1.92"
description = "Workspace coding tools and SDK tool adapters for Rho"
license = "MIT AND Apache-2.0"
repository = "https://github.com/matthewyjiang/rho"
readme = "README.md"

[features]
default = ["document-docx", "document-pdf", "document-spreadsheets"]
document-docx = ["dep:quick-xml", "dep:zip"]
document-pdf = ["dep:flate2", "dep:lopdf", "dep:pdf-inspector"]
document-spreadsheets = ["dep:calamine", "dep:zip"]

[dependencies]
rho-sdk = { version = "2.0.0", path = "../rho-sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
same-file = "1"
similar = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
calamine = { version = "0.35", optional = true }
flate2 = { version = "1", optional = true }
# Same major as pdf-inspector so preflight and extraction share one lopdf build.
lopdf = { version = "0.41", optional = true }
pdf-inspector = { version = "0.1.7", optional = true }
quick-xml = { version = "0.39", optional = true }
zip = { version = "7.2", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
