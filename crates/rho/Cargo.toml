[package]
name = "rho-coding-agent"
version = "3.0.0"
edition = "2021"
rust-version = "1.92"
description = "A fast Rust agent harness with a small footprint and opinionated defaults"
license = "MIT AND Apache-2.0"
repository = "https://github.com/matthewyjiang/rho"
readme = "../../README.md"
include = [
    "/src/**",
    "/tests/**",
    "/build.rs",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/THIRD-PARTY-NOTICES",
]

[[bin]]
name = "rho"
path = "src/main.rs"

[dependencies]
rho-sdk = { version = "6.0.0", path = "../rho-sdk" }
rho-providers = { version = "3.0.1", path = "../rho-providers", default-features = false }
rho-tools = { version = "2.0.0", path = "../rho-tools", package = "rho-agent-tools" }
rho-protocol = { version = "1.0.0", path = "../rho-protocol" }
tokio = { version = "1", features = ["full"] }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
humantime = "2"
anyhow = "1"
thiserror = "2"
toml = "1.1"
# Edits config.toml in place so saves keep the user's comments and key order.
toml_edit = { version = "0.25", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
txm = { version = "0.1.6", default-features = false, features = ["ratatui"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# `use-dev-tty` swaps crossterm's Unix event source from edge-triggered mio to
# level-triggered poll. The mio source drops the rest of a readiness batch after
# returning Resize, stranding already-buffered keys until more input arrives
# (crossterm-rs/crossterm#1126, rho #1286).
crossterm = { version = "0.29.0", features = ["event-stream", "osc52", "use-dev-tty"] }
futures-util = "0.3"
# Names the SSE item type in rmcp's StreamableHttpClient trait (tools/mcp/http_client.rs).
sse-stream = "0.2"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { workspace = true }
rustls-platform-verifier = "0.7"
regex = "1"
rusqlite = { version = "0.41", features = ["fallible_uint"] }
keyring = "4.1.2"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
digest-io = "0.1"
starlark = "=0.14.2"
schemars = "1"
base64 = "0.23"
url = "2"
percent-encoding = "2"
libc = "0.2"
unicode-segmentation = "1"
unicode-width = "0.2"
similar = "3"
same-file = "1"
shell-words = "1"
tempfile = "3"
portable-pty = "0.9"
fs2 = "0.4.3"
# `rho mcp serve --http` serves rmcp's streamable HTTP service with these.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "std",
] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
katex-rs = "0.3.0"
syntect = { version = "5", default-features = false, features = ["regex-fancy", "parsing", "dump-load"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
rmcp = { version = "3.1.1", default-features = false, features = [
    "auth",
    "client",
    "reqwest-tls-no-provider",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
# Finds an MCP server's executable on its session's PATH (#1659).
which = "8"
http = "1"
jsonschema = { version = "0.49", default-features = false }
agent-client-protocol = { version = "=5.0.0", features = ["stdio", "unstable_protocol_v2", "unstable_subagents"] }

[target.'cfg(unix)'.dependencies]
vt100 = "0.18"

[target.'cfg(windows)'.dependencies]
termwiz = "0.23.3"
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled", "rho-providers/bundled-sqlite"]

# Cargo reads profiles only from the root package. Workspace builds use the
# copy in the repo-root Cargo.toml; this copy applies when the published crate
# is the root (`cargo install rho-coding-agent`). Keep both tables in sync.
# Do not add `panic = "abort"`: the TUI recovers from renderer panics with
# `catch_unwind` (tui/markdown/math.rs, mermaid.rs).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
pretty_assertions = "1"
termwiz = "0.23.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
rho-tui-pty = { path = "../rho-tui-pty" }
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
winresource = "0.1.31"
syntect = { version = "5", default-features = false, features = [
    "regex-fancy",
    "parsing",
    "dump-load",
    "dump-create",
    "yaml-load",
] }
# Bat/syntect extra syntax dump (TypeScript, TOML, Dockerfile, ...). Matches fancy regex.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
